name: Live Prices

on:
  schedule:
    - cron: "*/30 0-6 * * 0-4" # KR 장중: KST 09:00–15:30 (UTC 00:00–06:30)
    - cron: "*/30 13-20 * * 1-5" # US 장중: ET 09:30–16:30 (UTC 13:30–20:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: node scripts/fetch-live.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_prices.json data/live_history.csv
          git diff --staged --quiet || git commit -m "data: 실시간 시세 갱신"
          git push
