name: KR Live Prices

on:
  schedule:
    # KST 09:00–15:30 (UTC 00:00–06:30), 평일 15분마다
    - cron: "*/15 0-6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install
      - run: node scripts/fetch-live.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_prices.json
          git diff --staged --quiet || git commit -m "data: KR 실시간 시세 갱신"
          git push
