<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Report Alpha — 투자심리 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.4rem; }
    .muted { color: #888; font-size: .85rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: .9rem; }
    th, td { border: 1px solid #ccc4; padding: .4rem .6rem; text-align: left; }
    th { background: #8881; position: sticky; top: 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .charts { display: grid; gap: 1.5rem; margin-top: 1.5rem; }
    .card { border: 1px solid #ccc4; border-radius: 8px; padding: 1rem; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>🌅 투자심리 vs 주가 대시보드</h1>
  <p class="muted" id="meta">불러오는 중…</p>
  <div class="charts" id="charts"></div>
  <h2 style="font-size:1.1rem;margin-top:2rem">전체 데이터</h2>
  <table id="table"><thead><tr>
    <th>날짜</th><th>종목</th><th>점수</th><th>추세</th><th>종가</th><th>종가일</th><th>인사이트</th>
  </tr></thead><tbody></tbody></table>

<script>
// 따옴표(쉼표·이스케이프 포함) 처리하는 최소 CSV 파서 → 객체 배열
function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      if (field !== "" || row.length) { row.push(field); rows.push(row); row = []; field = ""; }
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const header = rows.shift();
  return rows.map(r => Object.fromEntries(header.map((h, i) => [h, r[i]])));
}

// self-check: 따옴표 안 쉼표가 한 필드로 묶이는지
console.assert(
  parseCSV('a,b\n1,"x, y"')[0].b === "x, y",
  "CSV 파서: 따옴표 내 쉼표 처리 실패"
);

async function load() {
  const meta = document.getElementById("meta");
  try {
    const [scoresT, pricesT] = await Promise.all([
      fetch("./data/scores.csv").then(r => r.text()),
      fetch("./data/prices.csv").then(r => r.text()),
    ]);
    const scores = parseCSV(scoresT);
    const prices = parseCSV(pricesT);

    // date+ticker로 종가 매핑
    const priceBy = {};
    for (const p of prices) priceBy[p.date + "|" + p.ticker] = p;

    // 점수에 종가 결합
    const rows = scores.map(s => ({ ...s, ...(priceBy[s.date + "|" + s.ticker] || {}) }));
    rows.sort((a, b) => (a.date < b.date ? 1 : -1)); // 최신순

    renderTable(rows);
    renderCharts(rows);
    meta.textContent = `점수 ${scores.length}건 · 주가 ${prices.length}건 · 최종 ${rows[0]?.date ?? "-"}`;
  } catch (e) {
    meta.innerHTML = `<span class="err">데이터 로드 실패: ${e}</span>`;
  }
}

function renderTable(rows) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = rows.map(r => `<tr>
    <td>${r.date}</td><td>${r.ticker}</td>
    <td class="num">${r.score ?? ""}</td><td>${r.trend ?? ""}</td>
    <td class="num">${r.price ? Number(r.price).toLocaleString() + " " + (r.currency || "") : ""}</td>
    <td>${r.priceDate ?? ""}</td>
    <td>${r.insight ?? ""}</td>
  </tr>`).join("");
}

// 종목별로 점수(좌축)와 종가(우축)를 시간순 라인차트로
function renderCharts(rows) {
  const byTicker = {};
  for (const r of rows) (byTicker[r.ticker] ||= []).push(r);
  const container = document.getElementById("charts");

  for (const [ticker, list] of Object.entries(byTicker)) {
    list.sort((a, b) => (a.date < b.date ? -1 : 1)); // 오래된→최신
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<strong>${ticker}</strong><canvas></canvas>`;
    container.appendChild(card);

    new Chart(card.querySelector("canvas"), {
      type: "line",
      data: {
        labels: list.map(r => r.date),
        datasets: [
          { label: "투심 점수", data: list.map(r => r.score ? +r.score : null), yAxisID: "y", tension: .3 },
          { label: "종가", data: list.map(r => r.price ? +r.price : null), yAxisID: "y1", tension: .3 },
        ],
      },
      options: {
        interaction: { mode: "index", intersect: false },
        scales: {
          y: { type: "linear", position: "left", min: 0, max: 100, title: { display: true, text: "점수" } },
          y1: { type: "linear", position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "종가" } },
        },
      },
    });
  }
}

load();
</script>
</body>
</html>
